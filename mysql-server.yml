---
- hosts: debian
  tasks:
    - name: Loome allalaadimiseks kataloogi
      file:
         path: /root/allalaadimised
         owner: root
         group: root
         mode: "0755"
         state: directory
    - name: mysql install
      shell: |
          wget -O /root/allalaadimised/mysql-apt-config_0.8.40-1_all.deb https://dev.mysql.com/get/mysql-apt-config_0.8.40-1_all.deb

    - name: gnupg paidaldus
      apt:
        name: gnupg
        state: present
        update_cache: yes

    - name: mysql repo install
      apt:
        deb: /root/allalaadimised/mysql-apt-config_0.8.40-1_all.deb

    - name: apt update käsk
      apt:
        update_cache: yes

    - name: mysql-server paigaldus
      apt:
        name: mysql-server
        state: present
