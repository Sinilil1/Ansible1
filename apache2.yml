
---
- hosts: klient-deb
  tasks:
    - name: install apache2
      apt:
        name=apache2
        update_cache=yes
        state=latest

    - name: Loome public_html kataloog user_ile
      file:
        path=/home/user/public_html
        owner=user
        group=user
        mode=0755
        state=directory

    - name: Lubame userdir mod
      apache2_module:
        name=userdir
        state=present

    - name: Apache2 serverile alglaadimine(restart)
      service:
        name: apache2
        state: restarted

    - name: Kopeerimine index.html fail USER_ile kodus_public_html kataloogi
      copy:
        src: /var/www/html/index.html
        dest: /home/user/public_html/
        remote_src: yes
        owner: user
        group: user

    - name: Genereerin serverile unikaalse index.html faili
      ansible.builtin.template:
        src: /root/playbooks/templates/index.html.j2
        dest: /var/www/html/index.html
        owner: user
        group: user
        mode: '0444'

    - name: user index.html redigeerimine
      lineinfile:
        path: /home/user/public_html/index.html
        state: present
        regexp: "Apache2 Debian Default"
        line: "minu, useri veebileht"
        line: "-------------------------------------"

    - name: Alglaadimine Apache2
      service:
        name: apache2
        state: restarted

