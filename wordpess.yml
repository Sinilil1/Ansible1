
---
- name: WordPress_Andmebaasi seadistamine
  hosts: debian
  become: yes

  tasks:

    - name: Loome andmebaas nimega wpdatabase
      mysql_db:
        name: wpdatabase
        state: present

    - name: Loome kasutaja nimega=wpuser parool=qwerty
      mysql_user:
        name: wpuser
        password: qwerty
        priv: "wpdatabase.*:ALL,GRANT"
        state: present
        check_implicit_admin: yes

    - name: Laeb alla WordPressi
      get_url:
        url: https://wordpress.org/latest.tar.gz
        dest: /tmp/wordpress.tar.gz

    - name: Wordpress unzip
      unarchive:
        src: /tmp/wordpress.tar.gz
        dest: /var/www/html
        remote_src: yes

    - name: Kopeerime wp-config-sample.php kui wp-config.php vajalikku kohta
      copy:
        src: /var/www/html/wordpress/wp-config-sample.php
        dest: /var/www/html/wordpress/wp-config.php
        remote_src: yes

    - name: Määrame andmebaasi nime
      lineinfile:
        path: /var/www/html/wordpress/wp-config.php
        regexp: "database_name_here"
        line: "define('DB_NAME', 'wpdatabase');"

    - name: Määrame andmebaasi kasutajanime
      lineinfile:
        path: /var/www/html/wordpress/wp-config.php
        regexp: "username_here"
        line: "define('DB_USER', 'wpuser');"

    - name: Määrame andmebaasi kasutaja parooli
      lineinfile:
        path: /var/www/html/wordpress/wp-config.php
        regexp: "password_here"
        line: "define('DB_PASSWORD', 'qwerty');"

#Selgita (vastus läheb töö esitamise faili), miks Ansible Playbook’i käivitamine --check režiimis või>
# Viga tekib sellest, et fail mida playbook kontrollib või otsib, ei pruugi veel eksisteerida või lii>

#    - name: Apache2 restart
 #     service:
  #      name: apache2
   #     state: restarted

    - name: Paigaldame PHP ja vajalikud moodulid
      apt:
        name:
          - php8.4
          - libapache2-mod-php8.4
          - php8.4-mysql
          - php8.4-cli
        state: present
        update_cache: yes

    - name: Lubame PHP mooduli Apache2 jaoks
      command: a2enmod php8.4

    - name: Laadime alla WP-CLI
      get_url:
        url: https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
        dest: /usr/local/bin/wp
        mode: '0755'

    - name: Kontrollime kas WordPress on juba paigaldatud
      command: wp core is-installed --allow-root
      args:
        chdir: /var/www/html/wordpress
      register: wordpress_installed
      changed_when: false
      failed_when: false

    - name: Paigaldame WordPressi automaatselt
      command: >
        wp core install
        --url=http://{{ ansible_default_ipv4.address }}/wordpress
        --title="admin wordpressi sait"
        --admin_user=admin
        --admin_password=qwerty
        --skip-email
        --allow-root
      args:
        chdir: /var/www/html/wordpress
      when: wordpress_installed.rc != 0

    - name: Apache2 restart 2
      service:
        name: apache2
        state: restarted
